<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Easy Inbox Zero Options</title>
</head>
<body>
	<h1>Easy Inbox Zero</h1>
	<p>Choose the folders whose unread counts should be hidden.</p>
	<ul>
		<li>Put each folder name on its own line.</li>
		<li>Entries are case-sensitive.</li>
	</ul>
	<label for="folders">Folder names</label><br>
	<textarea id="folders" name="folders" rows="7" cols="32"></textarea>
	<p id="status" role="status" aria-live="polite"></p>
	<script src="options.js"></script>
</body>
</html>
